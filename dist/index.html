<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF0E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1310" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Filipino Mahjong — 16 tiles, five sets and a pair, and the ambition ledger. Plays in the browser." />
    <title>Mahjong</title>
    <style>
      /* Boot loader — shown before the app bundle downloads, so slow connections
         see tiles being arranged instead of a blank page. React replaces it on mount. */
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: #EEF0E8;
        font: 600 14px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) { #boot { background: #0B1310; } }
      #boot .rack { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 94vw; }
      #boot .rack span {
        width: 26px; height: 35px; border-radius: 5px;
        background: linear-gradient(160deg, #1E6B52, #0E3E2E);
        border: 1px solid #0A2C21;
        box-shadow: 0 2px 4px rgba(0, 0, 0, .3);
        animation: boot-wave 1s ease-in-out infinite;
      }
      #boot .label { color: #6E7A6C; letter-spacing: .02em; }
      @media (prefers-color-scheme: dark) { #boot .label { color: #7C887A; } }
      @keyframes boot-wave {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }
      @media (max-width: 560px) {
        #boot .rack { gap: 3px; max-width: 88vw; }
        #boot .rack span { width: 15px; height: 21px; border-radius: 3px; }
      }
      @media (prefers-reduced-motion: reduce) { #boot .rack span { animation: none; } }
    </style>
    <script type="module" crossorigin src="./assets/index-CkcnnjRg.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DHbRl5Me.css">
  </head>

        </div>

      </div>
    </div>
